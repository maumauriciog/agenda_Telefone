<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Agenda Telefônica</title>
</head>

<body>
    <header>
        <div class="container">
            <div class="alinhar">
                <img src="./imgs/icAgenda2.jpeg" alt="Agenda">
                <h1>Agenda Telefônica</h1>
            </div>
            <p>cadastre aqui seus contatos e telefones</p>
        </div>
    </header>
    <form id="form-agenda">
        <div class="container">
            <input id="nome-contato" type="text" placeholder="nome contato">
            <input id="telefone-contato" type="text" placeholder="telefone">
            <button type="submit">gravar</button>
        </div>
    </form>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>nome contato</th>
                    <th>telefone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script src="./script.js"></script>

</html>
